name: CI

# When to run: every push to main and every pull request. A PR that fails to
# build on either compiler turns red before it can be merged.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Pure-C helpers (MD5, JSON/CSV emitters) have no OS dependency, so we unit-test
  # them on Linux where they can actually run. A bug here would silently corrupt
  # --json/--csv output or make an imphash not match VirusTotal/YARA.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Help text is in sync with the headers
        run: |
          python3 tools/gen_usage.py
          git diff --exit-code src/usage.c || { echo "src/usage.c is stale: run python3 tools/gen_usage.py"; exit 1; }
      - name: Build + run helper tests
        run: |
          SRC="src/md5.c src/jsonutil.c src/ioc.c src/entropy.c src/pecksum.c src/imphash_ords.c src/pfparse.c src/artparse.c src/capa.c src/lnkparse.c src/rights.c src/destlist.c src/shellitem.c src/jsonmini.c src/sqlite.c src/mft.c src/usn.c src/patchdec.c src/logonparse.c src/werparse.c src/officeparse.c src/magicparse.c src/hashlist.c src/defhist.c src/bootparse.c"
          cc -I inc -Wall -Wextra -std=c11 $SRC tests/test_util.c -o test_util -lm
          ./test_util
      - name: Same tests + parser fuzz under AddressSanitizer / UBSan
        run: |
          SAN="-g -O1 -fsanitize=address,undefined -fno-sanitize-recover=all"
          SRC="src/md5.c src/jsonutil.c src/ioc.c src/entropy.c src/pecksum.c src/imphash_ords.c src/pfparse.c src/artparse.c src/capa.c src/lnkparse.c src/rights.c src/destlist.c src/shellitem.c src/jsonmini.c src/sqlite.c src/mft.c src/usn.c src/patchdec.c src/logonparse.c src/werparse.c src/officeparse.c src/magicparse.c src/hashlist.c src/defhist.c src/bootparse.c"
          cc -I inc -std=c11 $SAN $SRC tests/test_util.c -o test_util_san -lm
          ./test_util_san
          cc -I inc -std=c11 $SAN src/ioc.c src/pfparse.c src/artparse.c src/lnkparse.c src/rights.c src/capa.c src/cfb.c src/destlist.c src/regf.c src/shellitem.c src/jsonmini.c src/usn.c src/logonparse.c src/werparse.c src/hashlist.c src/magicparse.c src/officeparse.c src/patchdec.c src/bootparse.c tests/fuzz_parsers.c -o fuzz_parsers
          ./fuzz_parsers 300000
          # Compound-file reader: random files from tests/wine/cfbwrite.py must
          # read back byte-identical (sizes + MD5 per stream).
          cc -I inc -std=c11 $SAN src/cfb.c src/md5.c tests/cfb_dump.c -o cfb_dump
          python3 tests/cfb_roundtrip.py ./cfb_dump 200
      - name: .lnk parser vs an independent parser's expected output
        # The LnkParse3 project keeps real-world (incl. malicious) .lnk samples
        # with its parser's JSON output. Only those data files are used - no
        # code from it runs - pinned to a commit so the oracle cannot drift.
        run: |
          git clone -q https://github.com/Matmaus/LnkParse3 lnkref
          git -C lnkref checkout -q ad4230280b4ee1ceb3cdf5f274e6d92fb12e7abb
          cc -I inc -std=c11 -g -O1 -fsanitize=address,undefined -fno-sanitize-recover=all \
             src/lnkparse.c src/shellitem.c src/jsonutil.c tests/lnk_dump.c -o lnk_dump
          python3 -I tests/lnk_diff.py ./lnk_dump lnkref/tests/samples lnkref/tests/json
      - name: Jump List DestList vs real Win7/8/8.1/10 jump lists
        # Sample files from Eric Zimmerman's JumpList project (data only, no
        # code run), pinned to a commit; expected values are facts its own
        # tests assert, plus self-consistency checks inside each file.
        run: |
          git clone -q https://github.com/EricZimmerman/JumpList jlref
          git -C jlref checkout -q c158abb87dbcd83edbec296d4024efa2debf4cc7
          cc -I inc -std=c11 -g -O1 -fsanitize=address,undefined -fno-sanitize-recover=all \
             src/cfb.c src/destlist.c src/jsonutil.c tests/destlist_dump.c -o destlist_dump
          python3 -I tests/destlist_check.py ./destlist_dump jlref/JumpList.Test/TestFiles
      - name: JSON reader vs Python json (differential)
        # timeline parses the other commands' --json output with jsonmini;
        # random valid documents must decode to the same value as Python's
        # json module, random corruptions must be rejected exactly when
        # Python rejects them.
        run: |
          cc -I inc -std=c11 -g -O1 -fsanitize=address,undefined -fno-sanitize-recover=all \
             src/jsonmini.c tests/jm_dump.c -o jm_dump -lm
          python3 -I tests/jm_diff.py ./jm_dump 5000
      - name: SQLite reader vs Python's sqlite3 (differential) + fuzz
        # browser reads Chromium / Firefox databases with src/sqlite.c. Random
        # databases (page sizes, UTF-16, overflow chains, uncheckpointed WAL)
        # must read back row for row, column names must match PRAGMA
        # table_info, and corrupted copies must never trip the sanitizers.
        run: |
          SAN="-g -O1 -fsanitize=address,undefined -fno-sanitize-recover=all"
          cc -I inc -std=c11 $SAN src/sqlite.c tests/sqlite_dump.c -o sqlite_dump
          python3 -I tests/sqlite_diff.py ./sqlite_dump 60
          python3 -I tests/sqlite_seed.py seed.db
          cc -I inc -std=c11 $SAN src/sqlite.c tests/fuzz_sqlite.c -o fuzz_sqlite
          ./fuzz_sqlite seed.db 5000 seed.db-wal
      - name: Recycle Bin parser vs plaso test data
        # $I (Vista, Windows 10) and XP INFO2 files from plaso's test data
        # (data only, no code run), pinned to a commit; expected values are
        # the ones plaso's own recycler parser tests assert.
        run: |
          mkdir rbref
          for f in '$II3DF3L.zip' '$I103S5F.jpg' INFO2; do
            curl -sSfL -o "rbref/$f" "https://raw.githubusercontent.com/log2timeline/plaso/ee5a0ab4f7af07f61b0554ba8edc0700514efc5a/test_data/recycler/$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$f")"
          done
          cc -I inc -std=c11 -g -O1 -fsanitize=address,undefined -fno-sanitize-recover=all \
             src/artparse.c src/ioc.c tests/rb_dump.c -o rb_dump
          python3 -I tests/rb_check.py ./rb_dump rbref
      - name: Event log (.evtx) reader vs plaso test data + fuzz
        # System.evtx / System2.evtx from plaso's test data (data only, no
        # code run), pinned to a commit; record counts, record 1's full XML
        # and record 179 are the values plaso's own parser tests assert, and
        # every rendered record must be well-formed XML. Then the reader is
        # fuzzed with corrupted copies of the real file under ASan/UBSan.
        run: |
          mkdir evtxref
          for f in System.evtx System2.evtx; do
            curl -sSfL -o "evtxref/$f" "https://raw.githubusercontent.com/log2timeline/plaso/ee5a0ab4f7af07f61b0554ba8edc0700514efc5a/test_data/evtx/$f"
          done
          SAN="-g -O1 -fsanitize=address,undefined -fno-sanitize-recover=all"
          cc -I inc -std=c11 $SAN src/evtx.c tests/evtx_dump.c -o evtx_dump
          python3 -I tests/evtx_check.py ./evtx_dump evtxref
          cc -I inc -std=c11 $SAN src/evtx.c tests/fuzz_evtx.c -o fuzz_evtx
          ./fuzz_evtx evtxref/System.evtx 2000
          ./fuzz_evtx evtxref/System2.evtx 1000
      - name: Defender Detection History reader vs plaso test data + fuzz
        # Three real detection files from plaso's test data (data only, pinned
        # commit): the values its parser test asserts, the detection GUID
        # against the file name, the published EICAR SHA-256. Then corrupted
        # copies under ASan / UBSan.
        run: |
          mkdir dhref
          for f in 6AFE33A0-19BA-4FFF-892F-B700539D7D63 7C66C39C-49DD-42D7-9822-4039C98CC246 FC380697-A68D-4C94-B67F-9B6449039463; do
            curl -sSfL -o "dhref/$f" "https://raw.githubusercontent.com/log2timeline/plaso/f75784eea92ce1f946e822a675836da45d91309c/test_data/windefender_history/$f"
          done
          SAN="-g -O1 -fsanitize=address,undefined -fno-sanitize-recover=all"
          cc -I inc -std=c11 $SAN src/defhist.c tests/defhist_dump.c -o defhist_dump
          python3 -I tests/defhist_check.py ./defhist_dump dhref
          for f in dhref/*; do ./defhist_dump "$f" 100000; done
      - name: $MFT reader vs plaso test data + fuzz
        # plaso's test_data/MFT (a Windows XP volume; data only, pinned
        # commit): paths of a regular, a deleted and an orphaned file and an
        # Object ID's v1 time / MAC as plaso's NTFS parser tests assert, then
        # the reader is fuzzed with corrupted runs of real records.
        run: |
          curl -sSfL -o MFT "https://raw.githubusercontent.com/log2timeline/plaso/ee5a0ab4f7af07f61b0554ba8edc0700514efc5a/test_data/MFT"
          SAN="-g -O1 -fsanitize=address,undefined -fno-sanitize-recover=all"
          cc -I inc -std=c11 $SAN src/mft.c tests/mft_dump.c -o mft_dump
          python3 -I tests/mft_check.py ./mft_dump MFT
          # $UsnJrnl:$J records from the same project (19 records, first one asserted by its tests)
          curl -sSfL -o UsnJrnl.raw "https://raw.githubusercontent.com/log2timeline/plaso/ee5a0ab4f7af07f61b0554ba8edc0700514efc5a/test_data/UsnJrnl.raw"
          cc -I inc -std=c11 $SAN src/usn.c tests/usn_dump.c -o usn_dump
          python3 -I tests/usn_check.py ./usn_dump UsnJrnl.raw
          cc -I inc -std=c11 $SAN src/mft.c tests/fuzz_mft.c -o fuzz_mft
          ./fuzz_mft MFT 1000
      - name: ESE reader (SRUM) vs plaso test data + fuzz
        # plaso's test_data/SRUDB.dat (data only, pinned commit): the record
        # count over the three SRUM tables and the rows plaso's SRUM plugin
        # test asserts; then corrupted copies under ASan/UBSan.
        run: |
          curl -sSfL -o SRUDB.dat "https://raw.githubusercontent.com/log2timeline/plaso/ee5a0ab4f7af07f61b0554ba8edc0700514efc5a/test_data/SRUDB.dat"
          SAN="-g -O1 -fsanitize=address,undefined -fno-sanitize-recover=all"
          cc -I inc -std=c11 $SAN src/esedb.c tests/ese_dump.c -o ese_dump
          python3 -I tests/srum_check.py ./ese_dump SRUDB.dat
          cc -I inc -std=c11 $SAN src/esedb.c tests/fuzz_ese.c -o fuzz_ese
          ./fuzz_ese SRUDB.dat 60 SruDbIdMapTable "{973F5D5C-1D90-4944-BE8E-24B94231A174}" "{DD6636C4-8929-4683-974E-22C046A43763}"
      - name: Registry hive reader vs real hives (regipy test data)
        # Real NTUSER.DAT / SYSTEM / SOFTWARE / Amcache.hve files from the
        # regipy project (data only, pinned commit). Header fields, key/value
        # totals, value-type histograms and specific values must match the
        # facts regipy's tests assert; then the reader is mutation-fuzzed
        # starting from a real hive.
        run: |
          git clone -q https://github.com/mkorman90/regipy regipy
          git -C regipy checkout -q c6de929abc37d8315d1c31aba5e937db636f3303
          SAN="-g -O1 -fsanitize=address,undefined -fno-sanitize-recover=all"
          cc -I inc -std=c11 $SAN src/regf.c src/jsonutil.c tests/regf_dump.c -o regf_dump
          python3 -I tests/regf_check.py ./regf_dump regipy/regipy_tests/data
          # The test-only hive writer used by the offline fixtures must
          # produce what the reader reads back, key by key.
          python3 -I tests/regf_roundtrip.py ./regf_dump 100
          cc -I inc -std=c11 $SAN src/regf.c src/shellitem.c tests/fuzz_regf.c -o fuzz_regf
          python3 -c "import lzma;open('ntuser.dat','wb').write(lzma.open('regipy/regipy_tests/data/NTUSER.DAT.xz').read())"
          ./fuzz_regf ntuser.dat 2000

  # Functional tests on Linux: cross-compile with MinGW and run the real .exe
  # under wine. fixtures.py seeds a throw-away prefix with known-bad artifacts
  # and checks each is reported with the right reason (and benign controls are
  # not); wsmoke.py runs every command and checks exit codes, JSON and CSV;
  # fuzz.py feeds corrupted PE and .lnk files to the parsers.
  wine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW + wine
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-mingw-w64-x86-64 wine64 upx-ucl ninja-build
      - name: Cross-compile (same CMakeLists as the Windows jobs)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_SYSTEM_NAME=Windows \
                -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          cp build/winspect.exe ./winspect.exe
      - name: Functional fixtures + smoke under wine
        env:
          WINEPREFIX: ${{ runner.temp }}/wpfx
        run: |
          python3 tests/wine/fixtures.py ./winspect.exe
          python3 tests/wine/wsmoke.py ./winspect.exe
          python3 tests/wine/fuzz.py ./winspect.exe 60 150
          # events --evtx end to end on plaso's System.evtx (data only).
          mkdir -p evtxref
          for f in System.evtx System2.evtx; do
            curl -sSfL -o "evtxref/$f" "https://raw.githubusercontent.com/log2timeline/plaso/ee5a0ab4f7af07f61b0554ba8edc0700514efc5a/test_data/evtx/$f"
          done
          # Security logs of recorded attacks (EVTX-ATTACK-SAMPLES, data only,
          # pinned commit) for `logons`: an RDP logon through a tunnel, a
          # pass-the-hash logon, WMIC run with another account's credentials.
          EAS=https://raw.githubusercontent.com/sbousseaden/EVTX-ATTACK-SAMPLES/4ceed2f4706daf601c212a8f91c113dd85349a2c
          curl -sSfL -o evtxref/DE_RDP_Tunneling_4624.evtx "$EAS/Command%20and%20Control/DE_RDP_Tunneling_4624.evtx"
          curl -sSfL -o evtxref/LM_4624_mimikatz_sekurlsa_pth_source_machine.evtx "$EAS/Lateral%20Movement/LM_4624_mimikatz_sekurlsa_pth_source_machine.evtx"
          curl -sSfL -o evtxref/LM_WMIC_4648_rpcss.evtx "$EAS/Lateral%20Movement/LM_WMIC_4648_rpcss.evtx"
          curl -sSfL -o evtxref/CA_4624_4625_LogonType2_LogonProc_chrome.evtx "$EAS/Credential%20Access/CA_4624_4625_LogonType2_LogonProc_chrome.evtx"
          python3 tests/wine/evtxfiles.py ./winspect.exe evtxref
          curl -sSfL -o MFT "https://raw.githubusercontent.com/log2timeline/plaso/ee5a0ab4f7af07f61b0554ba8edc0700514efc5a/test_data/MFT"
          python3 tests/wine/mftfile.py ./winspect.exe MFT
          mkdir -p eseref
          for f in SRUDB.dat WebCacheV01.dat PartitionsEx-WebCacheV01.dat; do
            curl -sSfL -o "eseref/$f" "https://raw.githubusercontent.com/log2timeline/plaso/ee5a0ab4f7af07f61b0554ba8edc0700514efc5a/test_data/$f"
          done
          python3 tests/wine/esefiles.py ./winspect.exe eseref
          # Offline-hive mode (--hive / hive) on real Windows hives
          git clone -q https://github.com/mkorman90/regipy regipy
          git -C regipy checkout -q c6de929abc37d8315d1c31aba5e937db636f3303
          python3 tests/wine/hives.py ./winspect.exe regipy/regipy_tests/data

  build:
    runs-on: windows-latest

    strategy:
      # Don't cancel the MSVC job just because MinGW failed (or vice versa);
      # we want to see both results.
      fail-fast: false
      matrix:
        # The whole point of the two-compiler matrix: the same source must build
        # cleanly with Microsoft's compiler AND with GCC (MinGW). This is what
        # catches "works on my machine" header and flag assumptions.
        toolchain: [msvc, mingw]

    steps:
      - uses: actions/checkout@v4

      # --- MSVC toolchain -----------------------------------------------------
      - name: Set up MSVC
        if: matrix.toolchain == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure + build (MSVC)
        if: matrix.toolchain == 'msvc'
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release

      - name: Smoke test (MSVC)
        if: matrix.toolchain == 'msvc'
        # Run every command on real Windows and fail only on a crash (an exit
        # code outside the 0/1 our commands return). This is what catches a bad
        # pointer or struct-layout bug that a compile can't - the thing a
        # cross-build on Linux cannot verify.
        run: |
          $exe = "build\Release\winspect.exe"
          $f = "C:\Windows\System32\notepad.exe"
          $p = $PID
          function Smoke { param([string[]]$a)
            & $exe @a *> $null
            if ($LASTEXITCODE -lt 0 -or $LASTEXITCODE -gt 1) { throw "crash in: $($a -join ' ') => $LASTEXITCODE" }
          }
          Smoke @()
          foreach ($args in @(@("pe",$f), @("pe",$f,"--json"), @("sign",$f), @("hash",$f), @("strings",$f,"--ioc"))) { Smoke $args }
          foreach ($c in "list","services","drivers","autoruns","pipes","hosts","net","arp","routes","sessions","shares","certstore","tasks","objects","defender","usb","prefetch","shimcache","bam","firewall","taskcache","wmi","lnk","hunt","posture","events","hidden","sweep","userassist","mru","jumplist","rdp","sysinfo","programs","shellbags","pshistory","recyclebin","bits","comhijack","users","timeline","image","browser","pca","activities","logons","boots","dns","wer","office","detections","capability","volumes") { Smoke @($c); Smoke @($c,"--json") }
          foreach ($c in "inspect","threads","handles","regions","token","secinfo","modules","verify","triage") { Smoke @($c,"$p"); Smoke @($c,"$p","--json") }
          foreach ($args in @(@("modules","$p","--unsigned"), @("firewall","--inbound","--allow","--active","--csv"), @("autoruns","--csv"), @("objects","--global","--type","Mutant"), @("drivers","--sig"), @("services","--flagged"), @("prefetch","--dir","C:\Windows\Prefetch","--csv"), @("streams","C:\Windows\System32\drivers\etc"), @("lnk","--json"), @("autoruns","--sig"), @("services","--sig","--flagged"), @("events","--summary"), @("prefetch","--flagged"), @("hunt","--all"), @("handles","--find","ntdll","--type","File"), @("hive","C:\Windows\System32\config\SYSTEM"), @("amcache"), @("rdp"), @("rdp","--json"), @("magic","C:\Windows\System32\drivers\etc"), @("magic",$f,"--json"), @("magic","C:\Windows\System32\drivers","--flagged","--csv"), @("hash","C:\Windows\System32\drivers\etc","--csv"), @("logons","--summary"), @("logons","--all","--csv"), @("dns","--csv"), @("wer","--modules"), @("office","--flagged"), @("timeline","--sources","logons,wer,office"))) { Smoke $args }
          Write-Host "all commands ran without crashing"

      # --- MinGW toolchain ----------------------------------------------------
      - name: Set up MinGW
        if: matrix.toolchain == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure + build (MinGW)
        if: matrix.toolchain == 'mingw'
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Functional checks on real NTFS / Windows (MSVC)
        if: matrix.toolchain == 'msvc'
        # Things wine cannot emulate: alternate data streams, event logs.
        run: |
          $exe = "build\Release\winspect.exe"
          $d = Join-Path $env:RUNNER_TEMP "adstest"
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          Copy-Item C:\Windows\System32\notepad.exe (Join-Path $d "dl.exe")
          $motw = "[ZoneTransfer]`r`nZoneId=3`r`nHostUrl=https://downloads.example/dl.exe`r`n"
          Set-Content -Path (Join-Path $d "dl.exe") -Stream Zone.Identifier -Value $motw
          Set-Content -Path (Join-Path $d "dl.exe") -Stream hidden -Value "secret payload"
          $j = & $exe streams $d --json | ConvertFrom-Json
          $z = $j | Where-Object { $_.stream -like "*Zone.Identifier*" }
          if (-not $z -or $z.host_url -ne "https://downloads.example/dl.exe" -or -not $z.suspicious) { throw "streams: MOTW not decoded/flagged: $($j | ConvertTo-Json -Compress)" }
          $h = $j | Where-Object { $_.stream -like "*:hidden:*" }
          if (-not $h -or -not $h.suspicious) { throw "streams: unusual ADS not flagged" }
          # events must return valid JSON (the System log is readable without elevation)
          $e = & $exe events --max 5 --json | ConvertFrom-Json
          $e = & $exe events --since 24 --json | ConvertFrom-Json
          # events --summary: failed logons with 6 different account names from
          # this host must group into one source flagged as password spraying.
          # Only checked when the audit policy records logon failures.
          $audit = auditpol /get /subcategory:"Logon" 2>$null | Out-String
          foreach ($u in "wsa1","wsa2","wsa3","wsa4","wsa5","wsa6") {
            net use \\127.0.0.1\IPC$ /user:$u "wrong-$u" 2>$null | Out-Null
          }
          $sum = & $exe events --summary --since 1 --json | ConvertFrom-Json
          if ($audit -match "Failure") {
            $spray = $sum | Where-Object { $_.distinct_users -ge 5 -and $_.reason -like "*spraying*" }
            if (-not $spray) { throw "events --summary: spraying not flagged: $($sum | ConvertTo-Json -Compress)" }
          } else { Write-Host "logon-failure auditing is off: spraying check skipped" }
          # net: a program from a user-writable dir listening on all interfaces
          # must be flagged with the owning process path (wine reports pid 0
          # for every socket, so this can only be checked here).
          $src = Join-Path $env:TEMP "lst.c"
          Set-Content -Path $src -Value '#include <winsock2.h>
          #include <windows.h>
          #pragma comment(lib, "ws2_32.lib")
          int main(void){WSADATA w;WSAStartup(MAKEWORD(2,2),&w);SOCKET s=socket(AF_INET,SOCK_STREAM,0);
          struct sockaddr_in a={0};a.sin_family=AF_INET;a.sin_port=htons(47123);a.sin_addr.s_addr=INADDR_ANY;
          bind(s,(struct sockaddr*)&a,sizeof a);listen(s,1);Sleep(60000);return 0;}'
          cl /nologo $src /Fe:(Join-Path $env:TEMP "lst.exe") /Fo:(Join-Path $env:TEMP "lst.obj") | Out-Null
          $lp = Start-Process (Join-Path $env:TEMP "lst.exe") -PassThru
          Start-Sleep 3
          $n = & $exe net --flagged --json | ConvertFrom-Json
          $hit = $n | Where-Object { $_.local -like "*:47123" -and $_.reason -like "*listens on all interfaces*" }
          Stop-Process -Id $lp.Id -Force
          if (-not $hit) { throw "net: user-writable listener not flagged: $($n | ConvertTo-Json -Compress)" }
          # handles: a helper holds a read+write file open and blocks on a pipe
          # read. --find must name the file with the helper's pid, and the
          # per-pid listing must not hang on the pending pipe read.
          cl /nologo tests\holder.c /Fe:(Join-Path $env:TEMP "holder.exe") /Fo:(Join-Path $env:TEMP "holder.obj") | Out-Null
          $marker = Join-Path $env:TEMP "wsfind_marker.txt"
          $hp = Start-Process (Join-Path $env:TEMP "holder.exe") -ArgumentList "`"$marker`"","block" -PassThru
          Start-Sleep 3
          $hf = & $exe handles --find wsfind_marker --json | ConvertFrom-Json
          $mine = $hf | Where-Object { $_.pid -eq $hp.Id -and $_.type -eq "File" }
          if (-not $mine) { Stop-Process -Id $hp.Id -Force; throw "handles --find: marker not found: $($hf | ConvertTo-Json -Compress)" }
          $job = Start-Job { param($e, $p) & $e handles $p --json } -ArgumentList (Resolve-Path $exe).Path, $hp.Id
          if (-not (Wait-Job $job -Timeout 60)) { Stop-Process -Id $hp.Id -Force; throw "handles <pid>: hung on a blocked pipe" }
          $hl = Receive-Job $job | ConvertFrom-Json
          Stop-Process -Id $hp.Id -Force
          if (-not ($hl | Where-Object { $_.name -like "*wsfind_marker*" })) { throw "handles <pid>: read/write file handle not named" }
          # verify: a helper overwrites the start of one of its own functions
          # with a jump (what an inline hook is). The patch report must show
          # the changed bytes, decode the jump and name the module it lands in.
          cl /nologo /O1 tests\selfpatch.c /Fe:(Join-Path $env:TEMP "selfpatch.exe") /Fo:(Join-Path $env:TEMP "selfpatch.obj") | Out-Null
          foreach ($mode in "direct","tramp") {
            $sp = Start-Process (Join-Path $env:TEMP "selfpatch.exe") -ArgumentList $mode -PassThru -WindowStyle Hidden
            Start-Sleep 3
            $vj = & $exe verify $sp.Id --json | ConvertFrom-Json
            Stop-Process -Id $sp.Id -Force
            $t = $vj.checks.image_tamper
            $pt = @($t.patches)
            $dest = if ($mode -eq "direct") { $pt[0].target_module } else { $pt[0].final_module }
            if ($t.modified_sections -lt 1 -or $pt.Count -lt 1 -or $pt[0].disk -eq $pt[0].memory -or $dest -ne "selfpatch.exe") {
              throw "verify patch report ($mode): $($t | ConvertTo-Json -Compress -Depth 5)"
            }
          }
          # hunt: a copy of cmd.exe under another name is still cmd.exe by its
          # version resource; the real cmd.exe is not reported for that.
          $ren = Join-Path $env:TEMP "svc_update.exe"
          Copy-Item C:\Windows\System32\cmd.exe $ren
          $rp = Start-Process $ren -ArgumentList "/c","ping -n 20 127.0.0.1" -PassThru -WindowStyle Hidden
          Start-Sleep 2
          $hj = @(& $exe hunt --all --json | ConvertFrom-Json)
          Stop-Process -Id $rp.Id -Force -ErrorAction SilentlyContinue
          $hit = $hj | Where-Object { $_.name -eq "svc_update.exe" }
          if (-not $hit -or $hit.finding -notlike "*is cmd.exe under another name*") { throw "hunt renamed tool: $($hit | ConvertTo-Json -Compress)" }
          if ($hj | Where-Object { $_.name -eq "cmd.exe" -and $_.finding -like "*under another name*" }) { throw "hunt: the real cmd.exe reported as renamed" }
          # logons: on an elevated runner the Security log is readable. If
          # Get-WinEvent sees logon events, winspect must list logons too, and
          # the offline reader must agree with the live API on an exported log.
          $have = @(Get-WinEvent -FilterHashtable @{LogName="Security"; Id=4624} -MaxEvents 5 -ErrorAction SilentlyContinue).Count
          $lg = @(& $exe logons --all --json | ConvertFrom-Json)
          if ($have -gt 0 -and @($lg | Where-Object { $_.event -eq "logon" }).Count -eq 0) { throw "logons: Get-WinEvent sees 4624 events, winspect lists none" }
          $sev = Join-Path $env:RUNNER_TEMP "security.evtx"
          wevtutil epl Security $sev
          $lcut = (Get-Date).ToUniversalTime().AddMinutes(-2).ToString("yyyy-MM-dd HH:mm:ss")
          $ll = @(& $exe logons --all --max 100000 --json | ConvertFrom-Json | Where-Object { $_.id -eq 4624 -and $_.time -lt $lcut })
          $lo = @(& $exe logons --all --evtx $sev --json | ConvertFrom-Json | Where-Object { $_.id -eq 4624 -and $_.time -lt $lcut })
          $a = ($ll | ForEach-Object { "$($_.time)|$($_.account)|$($_.logon_type)|$($_.logon_id)" } | Sort-Object) -join "`n"
          $b = ($lo | ForEach-Object { "$($_.time)|$($_.account)|$($_.logon_type)|$($_.logon_id)" } | Sort-Object) -join "`n"
          if ($a -ne $b) { throw "logons --evtx differs from live: $($ll.Count) live vs $($lo.Count) offline" }
          # boots: same boots live and from an exported System log. Classic
          # events (1074 shutdown requests) carry their strings as repeated
          # <Data> elements; the offline reader must split them like the API.
          $bev = Join-Path $env:RUNNER_TEMP "system-boots.evtx"
          wevtutil epl System $bev
          $bcut = (Get-Date).ToUniversalTime().AddMinutes(-2).ToString("yyyy-MM-dd HH:mm:ss")
          $bl = @(& $exe boots --max 100000 --json | ConvertFrom-Json | Where-Object { $_.time -lt $bcut })
          $bo = @(& $exe boots --evtx $bev --json | ConvertFrom-Json | Where-Object { $_.time -lt $bcut })
          $ba = ($bl | ForEach-Object { "$($_.time)|$($_.event)|$($_.detail)" }) -join "`n"
          $bb = ($bo | ForEach-Object { "$($_.time)|$($_.event)|$($_.detail)" }) -join "`n"
          if ($ba -ne $bb) { throw "boots --evtx differs from live: $($bl.Count) live vs $($bo.Count) offline" }
          $kb = @(Get-WinEvent -FilterHashtable @{LogName="System"; ProviderName="Microsoft-Windows-Kernel-General"; Id=12} -MaxEvents 3 -ErrorAction SilentlyContinue).Count
          if ($kb -gt 0 -and @($bl | Where-Object { $_.event -eq "boot" }).Count -eq 0) { throw "boots: Get-WinEvent sees boot events, winspect lists none" }
          # volumes: the serial of C: is the one "vol" prints.
          $vs = ((cmd /c vol C:) | Select-String -Pattern "[0-9A-F]{4}-[0-9A-F]{4}").Matches[0].Value
          $vc = (& $exe volumes --json | ConvertFrom-Json) | Where-Object { $_.drive -eq "C:" }
          if (-not $vc -or $vc.serial -ne $vs) { throw "volumes: C: serial '$($vc.serial)' but vol says '$vs'" }
          # dns: a name that ipconfig shows in the resolver cache must be in
          # winspect's list too (same cache, two readers).
          Resolve-DnsName example.com -ErrorAction SilentlyContinue | Out-Null
          $ipc = ipconfig /displaydns | Out-String
          $dn = @(& $exe dns --json | ConvertFrom-Json)
          if ($ipc -match "example\.com" -and -not ($dn | Where-Object { $_.name -like "*example.com*" })) { throw "dns: example.com is in ipconfig /displaydns but not in winspect dns" }
          # magic: a program copied to a .jpg name is identified and flagged; a
          # real text file is not. hash --match finds the same file by SHA-256.
          $md = Join-Path $env:RUNNER_TEMP "magictest"
          New-Item -ItemType Directory -Force -Path $md | Out-Null
          Copy-Item C:\Windows\System32\notepad.exe (Join-Path $md "holiday.jpg")
          Copy-Item C:\Windows\System32\drivers\etc\hosts (Join-Path $md "hosts.txt")
          $mg = @(& $exe magic $md --json | ConvertFrom-Json)
          $bad = $mg | Where-Object { $_.suspicious }
          if (@($bad).Count -ne 1 -or $bad.path -notlike "*holiday.jpg" -or $bad.type -notlike "PE executable*") { throw "magic: $($mg | ConvertTo-Json -Compress)" }
          $sha = (Get-FileHash C:\Windows\System32\notepad.exe -Algorithm SHA256).Hash
          Set-Content -Path (Join-Path $env:RUNNER_TEMP "iocs.txt") -Value "$sha,notepad-copy"
          $hm = @(& $exe hash $md --match (Join-Path $env:RUNNER_TEMP "iocs.txt") --json | ConvertFrom-Json)
          if ($hm.Count -ne 1 -or $hm[0].label -ne "notepad-copy" -or $hm[0].sha256 -ne $sha.ToLower()) { throw "hash --match: $($hm | ConvertTo-Json -Compress)" }
          # events --evtx: export the live System log, then the offline reader
          # must give the same System rows (7045 / 104) as the live API for
          # every event written before the export.
          $ev = Join-Path $env:RUNNER_TEMP "system.evtx"
          wevtutil epl System $ev
          $cut = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm:ss")
          $live = & $exe events --max 1000 --json | ConvertFrom-Json | Where-Object { $_.channel -eq "System" -and $_.time -lt $cut }
          $off  = & $exe events --evtx $ev --max 1000 --json | ConvertFrom-Json | Where-Object { $_.time -lt $cut }
          $lk = ($live | ForEach-Object { "$($_.time)|$($_.id)|$($_.summary)" }) -join "`n"
          $ok = ($off  | ForEach-Object { "$($_.time)|$($_.id)|$($_.summary)" }) -join "`n"
          if ($lk -ne $ok) { throw "events --evtx differs from live: $(@($live).Count) live vs $(@($off).Count) offline" }
          Write-Host "events --evtx matches live ($(@($live).Count) System rows)"
          # usn --live: a file renamed from .txt to .exe and a deleted .ps1
          # must show up flagged in the live change journal of C:.
          $ud = Join-Path $env:TEMP "wsusn"
          New-Item -ItemType Directory -Force -Path $ud | Out-Null
          Set-Content (Join-Path $ud "wsusn_note.txt") "x"
          Rename-Item (Join-Path $ud "wsusn_note.txt") "wsusn_note.exe"
          Set-Content (Join-Path $ud "wsusn_tool.ps1") "x"
          Remove-Item (Join-Path $ud "wsusn_tool.ps1")
          $uj = & $exe usn --live C: --find wsusn_ --flagged --json | ConvertFrom-Json
          Remove-Item -Recurse -Force $ud
          if (-not ($uj | Where-Object { $_.name -eq "wsusn_note.exe" -and $_.reason -like "*renamed into*" -and $_.old_name -eq "wsusn_note.txt" })) {
            throw "usn --live: rename into .exe not flagged: $($uj | ConvertTo-Json -Compress)" }
          if (-not ($uj | Where-Object { $_.name -eq "wsusn_tool.ps1" -and $_.folder -like "*\wsusn" })) {
            throw "usn --live: deleted .ps1 not flagged with its folder: $($uj | ConvertTo-Json -Compress)" }
          # mft --live: a file created and then deleted must still be in the
          # live $MFT as a not-in-use record with its full path; a kept file
          # is listed as in use.
          $md = Join-Path $env:TEMP "wsmft"
          New-Item -ItemType Directory -Force -Path $md | Out-Null
          Set-Content (Join-Path $md "wsmft_keep.txt") "x"
          Set-Content (Join-Path $md "wsmft_gone.txt") "x"
          Remove-Item (Join-Path $md "wsmft_gone.txt")
          $mj = & $exe mft --live C: --deleted --find wsmft_ --json | ConvertFrom-Json
          Remove-Item -Recurse -Force $md
          if (-not ($mj | Where-Object { $_.path -like "*\wsmft\wsmft_gone.txt" -and -not $_.in_use })) {
            throw "mft --live: deleted file not found: $($mj | ConvertTo-Json -Compress)" }
          if (-not ($mj | Where-Object { $_.path -like "*\wsmft\wsmft_keep.txt" -and $_.in_use })) {
            throw "mft --live: kept file not found: $($mj | ConvertTo-Json -Compress)" }
          # bits: a helper creates a SUSPENDED job (bare-IP source, notify
          # command line), never resumed, cancelled when it reads a line. The
          # notify command must be the reason given.
          cl /nologo tests\bitsjob.c /Fe:(Join-Path $env:TEMP "bitsjob.exe") /Fo:(Join-Path $env:TEMP "bitsjob.obj") ole32.lib bits.lib uuid.lib | Out-Null
          $bp = New-Object System.Diagnostics.Process
          $bp.StartInfo.FileName = Join-Path $env:TEMP "bitsjob.exe"
          $bp.StartInfo.UseShellExecute = $false
          $bp.StartInfo.RedirectStandardInput = $true
          $bp.StartInfo.RedirectStandardOutput = $true
          [void]$bp.Start()
          do { $l = $bp.StandardOutput.ReadLine() } while ($l -ne $null -and $l -ne "ready")
          $bj = & $exe bits --json | ConvertFrom-Json
          $bp.StandardInput.WriteLine(""); $bp.WaitForExit(30000) | Out-Null
          $t = $bj | Where-Object { $_.name -eq "winspect-test-job" }
          if (-not $t) { throw "bits: test job not listed" }
          if ($t.reason -notlike "*notify*" -and $t.reason -notlike "*runs a command*") { throw "bits: notify command not flagged: $($t | ConvertTo-Json -Compress)" }
          if ($t.notify -notlike "*cmd.exe*") { throw "bits: notify command not read: $($t.notify)" }
          # comhijack: re-register the Shortcut class per-user with a DLL in
          # TEMP (never loaded: nothing creates the object meanwhile), expect
          # it flagged, then remove the per-user key again.
          $ck = "HKCU:\Software\Classes\CLSID\{00021401-0000-0000-C000-000000000046}\InprocServer32"
          New-Item -Path $ck -Force | Out-Null
          Set-Item -Path $ck -Value (Join-Path $env:TEMP "shellhook.dll")
          $chj = & $exe comhijack --flagged --json | ConvertFrom-Json
          Remove-Item -Path "HKCU:\Software\Classes\CLSID\{00021401-0000-0000-C000-000000000046}" -Recurse -Force
          if (-not ($chj | Where-Object { $_.clsid -eq "{00021401-0000-0000-C000-000000000046}" -and $_.machine_server -like "*shell32.dll" })) {
            throw "comhijack: per-user Shortcut override not flagged: $($chj | ConvertTo-Json -Compress)" }
          # users: a throw-away local account whose name ends in '$' (hidden
          # from "net user"), created disabled, must be flagged; then deleted.
          net user 'wstest$' 'Wx-9f3!kq2-Lm' /add /active:no | Out-Null
          $ua = & $exe users --json | ConvertFrom-Json
          net user 'wstest$' /delete | Out-Null
          $hid = $ua.accounts | Where-Object { $_.name -eq 'wstest$' }
          if (-not $hid -or -not $hid.suspicious -or $hid.enabled) { throw "users: hidden-style account not flagged: $($hid | ConvertTo-Json -Compress)" }
          if (-not ($ua.accounts | Where-Object { $_.admin -eq $true })) { throw "users: no Administrators member found" }
          if ($ua.machine_sid -notlike "S-1-5-21-*") { throw "users: machine SID missing: $($ua.machine_sid)" }
          # Offline hive reader vs the live registry on the SAME data: save
          # HKLM\SYSTEM to a real regf file, then the shimcache / bam records
          # read through --hive must equal the ones read through the live API.
          $hv = Join-Path $env:RUNNER_TEMP "system.hiv"
          reg save HKLM\SYSTEM $hv /y | Out-Null
          foreach ($c in "shimcache","bam") {
            $live = (& $exe $c --json | ConvertFrom-Json)
            $off  = (& $exe $c --hive $hv --json | ConvertFrom-Json)
            $lk = ($live | ForEach-Object { "$($_.path)|$($_.file_modified)$($_.last_run)" }) -join "`n"
            $ok = ($off  | ForEach-Object { "$($_.path)|$($_.file_modified)$($_.last_run)" }) -join "`n"
            if ($lk -ne $ok) { throw "$c --hive differs from live: $(@($live).Count) live vs $(@($off).Count) offline" }
            Write-Host "$c --hive matches live ($(@($live).Count) records)"
          }
          # amcache: the live Amcache.hve is locked; take a VSS copy (admin) and read it.
          $am = Join-Path $env:RUNNER_TEMP "amcache.hve"
          esentutl /y C:\Windows\AppCompat\Programs\Amcache.hve /vss /d $am 2>$null | Out-Null
          if (Test-Path $am) {
            $aj = & $exe amcache $am --json | ConvertFrom-Json
            if (-not ($aj | Where-Object { $_.sha1 -match '^[0-9a-f]{40}$' })) { throw "amcache: no entry with a SHA-1 in a real Amcache.hve" }
            Write-Host "amcache: $(@($aj).Count) entries from a VSS copy"
          } else { Write-Host "amcache: VSS copy not possible here, check skipped" }
          $hj = & $exe hive $hv "Select" --json | ConvertFrom-Json
          if (-not $hj.checksum_ok) { throw "hive: checksum of a reg-saved hive must be valid" }
          Write-Host "streams + events (+summary) + net + handles functional checks passed"

      - name: Smoke test (MinGW)
        if: matrix.toolchain == 'mingw'
        shell: msys2 {0}
        run: |
          exe=./build/winspect.exe
          f=/c/Windows/System32/notepad.exe
          p=$$
          # the msys2 shell runs bash with -e: catch the status with "||" so an
          # ordinary exit code 1 (usage, nothing found) does not end the step
          smoke() { rc=0; "$exe" "$@" >/dev/null 2>&1 || rc=$?; if [ $rc -gt 1 ]; then echo "crash: $* => $rc"; exit 1; fi; }
          smoke
          smoke pe "$f"; smoke pe "$f" --json; smoke sign "$f"; smoke hash "$f"; smoke strings "$f" --ioc
          for c in list services drivers autoruns pipes hosts net arp routes sessions shares certstore tasks objects defender usb prefetch shimcache bam firewall taskcache wmi lnk hunt posture events hidden sweep userassist mru jumplist rdp sysinfo programs shellbags pshistory recyclebin bits comhijack users timeline browser pca activities; do smoke $c; smoke $c --json; done
          for c in inspect threads handles regions token secinfo modules verify triage; do smoke $c "$p"; smoke $c "$p" --json; done
          smoke modules "$p" --unsigned; smoke firewall --inbound --allow --active --csv; smoke autoruns --csv; smoke objects --global --type Mutant; smoke drivers --sig; smoke services --flagged; smoke streams /c/Windows/System32/drivers/etc; smoke lnk --json; smoke autoruns --sig; smoke services --sig --flagged; smoke events --summary; smoke prefetch --flagged; smoke hunt --all; smoke handles --find ntdll --type File; smoke hive /c/Windows/System32/config/SYSTEM; smoke amcache; smoke usb --csv; smoke rdp; smoke rdp --json
          echo "all commands ran without crashing"

  # Copies the logs of failed jobs to the ci-logs branch (one commit, replaced
  # on every run), so a failure can be read with a plain "git fetch" - no
  # browser or GitHub login needed. Each file holds the job's step results,
  # the lines that look like errors, and the end of the log.
  report:
    if: always() && github.event_name == 'push'
    needs: [unit, wine, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Collect the logs of failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > jobs.json
          echo "$GITHUB_SHA" > out/commit.txt
          jq -r '.jobs[] | "\(.conclusion // .status)\t\(.name)"' jobs.json > out/summary.txt
          cat out/summary.txt
          jq -r '.jobs[] | select(.conclusion == "failure") | "\(.id) \(.name)"' jobs.json | while read -r id name; do
            f="out/$(printf '%s' "$name" | tr -c 'A-Za-z0-9' '_').log"
            # The log may not be served the moment a job ends: retry a few
            # times, and keep the error text if it still fails.
            for try in 1 2 3 4 5 6; do
              curl -sSfL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$id/logs" -o full.log 2> curl.err && break
              sleep 20
            done
            [ -s full.log ] || { echo "(log not available: $(cat curl.err))"; } > full.log
            jq -r --argjson id "$id" '.jobs[] | select(.id == $id) | .steps[] | "\(.conclusion // .status)\t\(.name)"' jobs.json > "$f"
            { echo; echo "==== lines that look like errors"; grep -n -i -E "error|fatal|fail|traceback|not found|cannot|undefined" full.log | head -300 || true; } >> "$f"
            { echo; echo "==== last 500 lines"; tail -500 full.log; } >> "$f"
          done
      - name: Publish them on the ci-logs branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q -b ci-logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "CI logs for $GITHUB_SHA"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
